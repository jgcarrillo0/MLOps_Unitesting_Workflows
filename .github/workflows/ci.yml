name: CI/CD - unit tests and Docker Hub

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_PATH: .
  IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE }}

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        working-directory: ${{ env.APP_PATH }}
        run: uv sync
      - name: Run pytest
        working-directory: ${{ env.APP_PATH }}
        run: uv run pytest -v
      - name: Build Docker test image
        working-directory: ${{ env.APP_PATH }}
        run: docker build --target test -t preprocessing-tests .
      - name: Run pytest inside Docker
        run: docker run --rm preprocessing-tests

  publish-dockerhub:
    name: publish-dockerhub
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check image name
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          if [ -z "$IMAGE_NAME" ]; then
            echo 'Configure repository variable DOCKERHUB_IMAGE' >&2
            exit 1
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_PATH }}
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
